name = "cardex"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Workers AI: the vision model that reads the photo.
[ai]
binding = "AI"

[vars]
VISION_MODEL = "@cf/llava-hf/llava-1.5-7b-hf"
# Extra browser origins allowed to call the API, comma separated.
ALLOWED_ORIGINS = ""

[observability]
enabled = true
